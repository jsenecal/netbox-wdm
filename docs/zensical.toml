[project]
site_name = "NetBox WDM"
site_url = "https://jsenecal.github.io/netbox-wdm/"
site_description = "Wavelength division multiplexing (WDM) device management for NetBox: ITU channel plans, ROADM editing, and circuit trace visualization"
site_author = "Jonathan Senecal"
repo_url = "https://github.com/jsenecal/netbox-wdm"
repo_name = "jsenecal/netbox-wdm"
edit_uri = "edit/main/docs/"
docs_dir = "."
nav = [
  { "Home" = "index.md" },
  { "User Guide" = [
    { "Getting Started" = "user/getting-started.md" },
    { "DeviceType Setup" = "user/device-types.md" },
    { "WDM Profiles" = "user/wdm-profiles.md" },
    { "WDM Nodes" = "user/wdm-nodes.md" },
    { "Modular Chassis" = "user/modular-chassis.md" },
    { "ITU Channel Plans" = "user/itu-grids.md" },
    { "Cabling and Topologies" = "user/cabling.md" },
    { "Wavelength Editor" = "user/wavelength-editor.md" },
    { "Circuits" = "user/circuits.md" },
    { "Circuit Trace" = "user/circuit-trace.md" },
    { "Port Sync" = "user/port-sync.md" },
  ] },
  { "Developer" = [
    { "Architecture" = "developer/architecture.md" },
    { "Models Reference" = "developer/models.md" },
    { "Port Topology" = "developer/port-topology.md" },
    { "Wavelength Path Tracing" = "developer/path-tracing.md" },
    { "REST API" = "developer/rest-api.md" },
    { "GraphQL API" = "developer/graphql.md" },
    { "Port Sync (internal)" = "developer/port-sync.md" },
    { "Style Guide" = "developer/style-guide.md" },
  ] },
]

[project.theme]
features = [
  "content.action.edit",
  "content.action.view",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"
